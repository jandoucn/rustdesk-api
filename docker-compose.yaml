name: rustdesk-api

services:
  api:
    image: crpi-7xxhnenx29e9prnb.cn-hongkong.personal.cr.aliyuncs.com/ollydocker/rustdesk-api:latest
    pull_policy: always
    container_name: rustdesk-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RUSTDESK_PORT:-7000}:80"
    environment:
      RUSTDESK_DB_DRIVER: sqlite
      RUSTDESK_DB: /var/www/data/rustdesk.db
      RUSTDESK_INSTALL_CONFIG: /var/www/data/install.json
      RUSTDESK_PROVISIONER_URL: http://rustdesk-api-provisioner:8080
      RUSTDESK_PROVISIONER_SECRET: ${RUSTDESK_PROVISIONER_SECRET:?set RUSTDESK_PROVISIONER_SECRET}
      RUSTDESK_TRUSTED_PROXY_IPS: ${RUSTDESK_TRUSTED_PROXY_IPS:-}
      RUSTDESK_GEOIP_DATABASE: ${RUSTDESK_GEOIP_DATABASE:-/var/www/data/GeoLite2-City.mmdb}
      RUSTDESK_UPDATE_BASE_URL: ${RUSTDESK_UPDATE_BASE_URL:-https://rdapi.yan.life}
      RUSTDESK_UPDATE_KEYS_JSON: ${RUSTDESK_UPDATE_KEYS_JSON:-{"schema":1,"keys":[]}}
      RUSTDESK_UPDATE_PUBLISH_TOKEN: ${RUSTDESK_UPDATE_PUBLISH_TOKEN:-}
      RUSTDESK_UPDATE_DOWNLOAD_PREFIX: ${RUSTDESK_UPDATE_DOWNLOAD_PREFIX:-https://download.yan.life/rustdesk/stable/}
    volumes:
      - ./data:/var/www/data
      - ${RUSTDESK_RELEASES_PATH:-./releases}:/var/www/releases:ro
    networks:
      - rustdesk-api-net

  provisioner:
    image: crpi-7xxhnenx29e9prnb.cn-hongkong.personal.cr.aliyuncs.com/ollydocker/rustdesk-api-provisioner:latest
    pull_policy: always
    container_name: rustdesk-api-provisioner
    restart: unless-stopped
    profiles: [setup]
    environment:
      PROVISIONER_SECRET: ${RUSTDESK_PROVISIONER_SECRET:?set RUSTDESK_PROVISIONER_SECRET}
      MYSQL_IMAGE: ${MYSQL_IMAGE:-docker.1ms.run/mysql:8.4}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./provisioner-state:/state
    networks:
      - rustdesk-api-net

networks:
  rustdesk-api-net:
    name: rustdesk-api-net
