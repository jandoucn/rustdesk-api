<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RustDesk API</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="public-page">
  <main class="public-shell">
    <div class="public-brand">
      <div class="brand"><span class="brand-mark">RD</span><span class="brand-copy"><strong>RustDesk API</strong><span>Service endpoint</span></span></div>
    </div>
    <div class="public-grid">
      <div class="public-copy">
        <p class="eyebrow">Service available</p>
        <h1>RustDesk API</h1>
        <p>账户、设备配置与通讯录同步服务运行正常。</p>
      </div>
      <section class="health-panel" aria-label="服务状态">
        <div class="health-row"><span>服务状态</span><strong class="health-value"><span class="status-dot online"></span>运行正常</strong></div>
        <div class="health-row"><span>协议入口</span><code>/api/*</code></div>
        <div class="health-row"><span>响应模式</span><strong class="health-value">JSON / HTTPS</strong></div>
      </section>
    </div>
  </main>
</body>
</html>
