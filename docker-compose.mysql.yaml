services:
  api:
    build: .
    restart: unless-stopped
    container_name: rustdesk-api
    ports:
      - "7000:80"
    environment:
      RUSTDESK_DB_DRIVER: mysql
      RUSTDESK_DB_HOST: mysql
      RUSTDESK_DB_PORT: 3306
      RUSTDESK_DB_NAME: ${RUSTDESK_DB_NAME:-rustdesk}
      RUSTDESK_DB_USER: ${RUSTDESK_DB_USER:-rustdesk}
      RUSTDESK_DB_PASSWORD: ${RUSTDESK_DB_PASSWORD:?set RUSTDESK_DB_PASSWORD}
      RUSTDESK_ADMIN_PATH: ${RUSTDESK_ADMIN_PATH:-/ops-console}
      RUSTDESK_TRUSTED_PROXY_IPS: ${RUSTDESK_TRUSTED_PROXY_IPS:-}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${RUSTDESK_DB_NAME:-rustdesk}
      MYSQL_USER: ${RUSTDESK_DB_USER:-rustdesk}
      MYSQL_PASSWORD: ${RUSTDESK_DB_PASSWORD:?set RUSTDESK_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
