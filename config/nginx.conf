user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
	worker_connections 768;
	# multi_accept on;
}

http {
	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on; 
	
	server {
        listen [::]:80 default_server;
        listen 80 default_server;
        server_name _;		
		index  index.php index.html index.htm;
		root   /var/www/html;

		location /update/files/ {
			alias /var/www/releases/;
			autoindex off;
			add_header X-Content-Type-Options nosniff always;
		}
		location = /update { return 404; }
		location = /update/ { return 404; }

		location = /rd/update/v1/policy/stream {
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_buffering off;
			proxy_cache off;
			proxy_read_timeout 30s;
			proxy_pass http://127.0.0.1:8787;
		}

		location ^~ /_rustdesk-stream-internal/ { return 404; }

		#REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
		location / {
			if (!-e $request_filename) {
				rewrite ^/(.*)$ /index.php?s=/$1 last;
			}
		}
        #REWRITE-END
        
        #PHP-INFO-START  PHP引用配置，可以注释或修改
        location ~ \.php$ {
            root           html;
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
			fastcgi_param  SCRIPT_FILENAME  /var/www/html$fastcgi_script_name;
            include        fastcgi_params;
        }
        #PHP-INFO-END
		    
        #禁止访问的文件或目录
        location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md)
	        {
	            return 404;
	        }
	    }

	server {
		listen 127.0.0.1:8081;
		server_name localhost;
		access_log off;

		location = /_rustdesk-stream-internal/auth {
			include fastcgi_params;
			fastcgi_pass 127.0.0.1:9000;
			fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
			fastcgi_param QUERY_STRING s=/_rustdesk-stream-internal/auth&$args;
			fastcgi_param HTTP_LAST_EVENT_ID $http_last_event_id;
			fastcgi_param HTTP_X_RUSTDESK_DEVICE_ID $http_x_rustdesk_device_id;
			fastcgi_param HTTP_X_RUSTDESK_DEVICE_PUBLIC_KEY $http_x_rustdesk_device_public_key;
			fastcgi_param HTTP_X_RUSTDESK_DEVICE_TIMESTAMP $http_x_rustdesk_device_timestamp;
			fastcgi_param HTTP_X_RUSTDESK_DEVICE_NONCE $http_x_rustdesk_device_nonce;
			fastcgi_param HTTP_X_RUSTDESK_DEVICE_SIGNATURE $http_x_rustdesk_device_signature;
		}

		location = /_rustdesk-stream-internal/snapshot {
			include fastcgi_params;
			fastcgi_pass 127.0.0.1:9000;
			fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
			fastcgi_param QUERY_STRING s=/_rustdesk-stream-internal/snapshot;
		}

		location / { return 404; }
	}
}
