name: Build private Aliyun ACR images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rustdesk-api
            context: .
            file: Dockerfile
            latest_tag: latest
            commit_prefix: commit-
            release_prefix: ''
          - image: rustdesk-api-provisioner
            context: installer
            file: installer/Dockerfile
            latest_tag: provisioner-latest
            commit_prefix: provisioner-commit-
            release_prefix: provisioner-
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-7xxhnenx29e9prnb.cn-hongkong.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: crpi-7xxhnenx29e9prnb.cn-hongkong.personal.cr.aliyuncs.com/ollydocker/rustdesk-api
          tags: |
            type=raw,value=${{ matrix.latest_tag }},enable={{is_default_branch}}
            type=ref,event=tag,prefix=${{ matrix.release_prefix }}
            type=sha,prefix=${{ matrix.commit_prefix }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
